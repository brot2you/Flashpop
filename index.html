<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlashPop">
<meta name="description" content="FlashPop by BROT2YOU : cartes mémoire et jeux pour réviser les langues, les sciences, les maths… Gratuit, sans compte.">
<title>FlashPop · by BROT2YOU APP</title>
<link rel="icon" href="fp-icon.png"><link rel="apple-touch-icon" href="fp-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* FlashPop · direction artistique « fiches bristol & surligneurs » */
:root{
  --ink:#3A4570; --ink2:#6A7293; --ink3:#9AA2BD;
  --bg:#F6F7FC; --paper:#FFFFFF; --cream:#FFFCF0;
  --rule:#E6ECF8; --rule2:#CBD7F2; --margin:#F4A3AA; --line:#D8DEEC;
  --yellow:#FFF0A6; --pink:#FFD1E6; --green:#C2F0D6; --blue:#CDE6FF; --orange:#FFDDB8; --violet:#E1D7FF; --coral:#FFC9C4;
  --ok:#3E9B78; --ok-bg:#E5F8EE; --bad:#D9707B; --bad-bg:#FFE8EB; --warn-bg:#FFF8D9; --info-bg:#E9F3FF;
  --b:2px solid var(--ink); --sh:3px 3px 0 #C9D0E6; --sh2:5px 5px 0 #C9D0E6;
  --font:'Figtree',system-ui,sans-serif; --title:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;font-weight:500;
  background-color:var(--bg);
  background-image:linear-gradient(90deg,rgba(203,215,242,.25) 1px,transparent 1px),linear-gradient(180deg,rgba(203,215,242,.38) 1px,transparent 1px);
  background-size:32px 32px,100% 8px}
body.dys{--font:'Lexend',system-ui,sans-serif;--title:'Lexend',system-ui,sans-serif;letter-spacing:.02em;word-spacing:.08em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--title);margin:0;font-weight:800;letter-spacing:-.015em;line-height:1.12}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:6px 16px 100px}
.hidden{display:none!important}
.muted{color:var(--ink2)}
.small{font-size:.86em}
.spacer{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}

/* icons */
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;margin-right:.35em}
.ic.fill{fill:currentColor}
.btn>.ic,.chip>.ic,.tag>.ic,.tab>.ic,.icon-btn>.ic,.stat>.ic,.toast>.ic,.msay>.ic,.say>.ic,.e>.ic,.si>.ic,.avatar>.ic,.play-prog>.ic,.sg>.ic,.res-e>.ic,.ear>.ic,.x>.ic,.got>.ic,.fav>.ic,.opt .ic,.term-row .b .ic,.meta .ic,.hud .ic,.combo .ic,.tabs .ic{margin-right:0}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;max-width:1000px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px}
.logo-mark{width:46px;height:46px;flex:none}
.wm{font-family:var(--title);font-weight:800;font-size:1.6rem;letter-spacing:-.035em}
.icon-btn{width:46px;height:46px;border-radius:12px;background:var(--paper);border:var(--b);box-shadow:var(--sh);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.icon-btn .ic{width:22px;height:22px}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #C9D0E6}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-family:var(--title);font-weight:700;font-size:1rem;
  background:var(--paper);color:var(--ink);border:var(--b);box-shadow:var(--sh);min-height:46px;text-decoration:none;transition:transform .08s,box-shadow .08s;line-height:1.1;text-align:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #C9D0E6}
.btn.pri{background:#5B67A0;color:#fff;border-color:#5B67A0}
.btn.yellow{background:var(--yellow)}
.btn.pink{background:var(--pink)}
.btn.green{background:var(--green)}
.btn.cyan{background:var(--blue)}
.btn.red{background:var(--coral)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.btn.ghost:active{transform:none}
.btn.sm{padding:6px 12px;min-height:38px;font-size:.92rem;border-radius:10px}
.btn.big{padding:13px 20px;font-size:1.1rem;min-height:56px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* generic card */
.card{background:var(--paper);border:var(--b);border-radius:14px;box-shadow:4px 4px 0 #C9D0E6;padding:16px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}
.sec-title h2{font-size:1.45rem}
.sec-title .count{font-family:var(--title);font-weight:700;background:var(--violet);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:.9rem}

/* profile */
.me{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;background:var(--paper);border:var(--b);border-radius:14px;box-shadow:var(--sh2);padding:14px}
.av-btn{display:block;border-radius:50%}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--av,var(--yellow));border:var(--b);display:grid;place-items:center;flex:none}
.avatar .ic{width:34px;height:34px;stroke-width:1.9}
.me-txt{min-width:0}
.me h1{font-size:1.6rem}
.lvl-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.lvl{font-family:var(--title);font-weight:700;font-size:.85rem;background:var(--violet);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:2px 8px}
.xpbar{flex:1;min-width:120px;height:14px;border:var(--b);border-radius:999px;background:#fff;overflow:hidden;display:block}
.xpbar i{display:block;height:100%;background:var(--yellow);background-image:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.45) 6px 9px);border-right:2px solid var(--ink);transition:width .6s}
.xp{font-weight:800;font-size:.82rem;color:var(--ink2)}
.me-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;background:#F6F8FC}
.stat .ic{grid-row:1/3;width:24px;height:24px}
.stat b{font-family:var(--title);font-size:1.25rem;line-height:1}
.stat span{font-size:.72rem;font-weight:700;color:var(--ink2);line-height:1.15}
.st-fl{background:#FFF0E6}.st-fl .ic{color:#E98A6B}
.st-ok{background:var(--ok-bg)}.st-ok .ic{color:var(--ok)}
.st-md{background:var(--warn-bg)}
@media(max-width:420px){.stat{grid-template-columns:1fr;text-align:center;justify-items:center;padding:6px 4px}.stat .ic{grid-row:auto;width:20px;height:20px}}

.quick{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px;margin-top:16px}
.quick .btn{padding:10px 8px}
@media(max-width:420px){.quick .btn{font-size:.92rem;flex-direction:column;gap:4px;min-height:64px}}

/* search + filters */
.search-wrap{position:relative;display:block;margin-bottom:10px}
.search-wrap>.ic{position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--ink2)}
.search{width:100%;padding:12px 14px 12px 44px;border-radius:12px;border:var(--b);background:var(--paper);outline:none;font-weight:600}
.search:focus{box-shadow:0 0 0 3px #CDE6FF}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--paper);border:var(--b);font-weight:800;font-size:.9rem;white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip.on{background:#5B67A0;color:#fff;border-color:#5B67A0}
.chip[style].on{background:var(--cc);color:var(--ink)}

/* index cards (lists) */
.grid-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 18px;padding-top:6px}
.set-card{position:relative;width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:156px;margin-top:14px;
  padding:16px 14px 14px 46px;background-color:var(--paper);border:var(--b);border-radius:3px 10px 10px 10px;box-shadow:4px 4px 0 #C9D0E6;
  background-image:linear-gradient(90deg,transparent 33px,var(--margin) 33px,var(--margin) 35px,transparent 35px),repeating-linear-gradient(180deg,transparent 0 25px,var(--rule) 25px 26px);
  background-position:0 0,0 14px;transition:transform .12s,box-shadow .12s}
.set-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #C9D0E6}
.set-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #C9D0E6}
.tab{position:absolute;top:-16px;left:-2px;display:inline-flex;align-items:center;gap:5px;background:var(--c);border:var(--b);border-bottom:0;border-radius:8px 8px 0 0;padding:2px 10px 3px;font-weight:800;font-size:.78rem;line-height:1.3}
.tab .ic{width:14px;height:14px}
.si{width:40px;height:40px;border:var(--b);border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none}
.si .ic{width:22px;height:22px}
.set-card h3{font-size:1.2rem;word-break:break-word;padding-right:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;font-weight:800;color:var(--ink2)}
.meta .mm,.meta .got{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink2);border-radius:999px;padding:0 8px;font-size:.75rem}
.meta .got .ic{width:13px;height:13px}
.fav{position:absolute;right:12px;top:12px;color:#F2C94C}
.fav .ic{width:20px;height:20px;stroke:var(--ink);stroke-width:1.6}
.mini-bar{display:flex;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin-top:auto}
.mini-bar i{display:block;height:100%}
.mini-bar .b2{background:var(--green)}
.mini-bar .b1{background:var(--yellow)}
.resume .set-card{max-width:520px;min-height:0}
.empty-card{text-align:center;background:var(--paper);border:var(--b);border-radius:14px;box-shadow:var(--sh2);padding:28px 18px}
.empty-card .stack-art .logo-mark{width:96px;height:96px}
.empty-card h2{font-size:1.4rem;margin:8px 0 6px}
.empty-card p{color:var(--ink2);max-width:420px;margin:0 auto 16px;font-weight:600}
.empty-line{text-align:center;color:var(--ink2);font-weight:700;padding:20px}

/* set view */
.set-hero{position:relative;margin-top:22px;background-color:var(--paper);border:var(--b);border-radius:3px 14px 14px 14px;box-shadow:var(--sh2);padding:18px 16px 16px 54px;
  background-image:linear-gradient(90deg,transparent 39px,var(--margin) 39px,var(--margin) 41px,transparent 41px),repeating-linear-gradient(180deg,transparent 0 27px,var(--rule) 27px 28px);background-position:0 0,0 16px}
.set-hero .tab{font-size:.85rem;top:-18px}
.sh-top{display:flex;gap:14px;align-items:flex-start}
.set-hero .si{width:56px;height:56px;border-radius:12px}
.set-hero .si .ic{width:30px;height:30px}
.sh-txt{min-width:0}
.set-hero h1{font-size:clamp(1.5rem,5vw,2.15rem);word-break:break-word}
.set-hero .desc{margin:4px 0 0;color:var(--ink2);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--ink);padding:2px 10px;border-radius:999px;font-weight:800;font-size:.8rem}
.tag .ic{width:14px;height:14px}
.mastery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mastery div{border:var(--b);border-radius:10px;padding:8px 6px;text-align:center}
.mastery b{display:block;font-family:var(--title);font-size:1.55rem;line-height:1.05}
.mastery span{font-size:.78rem;font-weight:800;color:var(--ink2)}
.m0{background:#F3F5FB}.m1{background:var(--warn-bg)}.m2{background:var(--ok-bg)}
.set-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.set-actions .btn{flex:1;min-width:140px}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mode-tile{background:var(--mc);color:var(--ink);border:var(--b);border-radius:14px;box-shadow:4px 4px 0 #C9D0E6;padding:12px;text-align:left;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .08s,box-shadow .08s}
.mode-tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #C9D0E6}
.mode-tile .e{width:46px;height:46px;background:#fff;border:var(--b);border-radius:12px;display:grid;place-items:center}
.mode-tile .e .ic{width:25px;height:25px}
.mode-tile b{font-family:var(--title);font-size:1.18rem;display:block;font-weight:800}
.mode-tile small{display:flex;align-items:center;gap:4px;font-weight:700;font-size:.8rem;opacity:.85}
.mode-tile small .ic{width:14px;height:14px;margin:0}
.mode-tile.off{filter:grayscale(1);opacity:.45}

.seg{display:inline-flex;background:var(--paper);border:var(--b);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:8px;font-weight:800;font-size:.88rem}
.seg button.on{background:#5B67A0;color:#fff}
.opts-row{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;margin:16px 0 4px;font-weight:800}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.94rem;cursor:pointer;user-select:none}
.toggle .ic{width:16px;height:16px;margin:0 2px}
.toggle .sw{width:46px;height:28px;border-radius:999px;background:#fff;border:var(--b);position:relative;transition:background .2s;flex:none}
.toggle .sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#5B67A0;transition:left .2s}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw:after{left:21px}

.term-list{display:flex;flex-direction:column;gap:10px}
.term-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;background:var(--paper);border:var(--b);border-left-width:8px;border-left-color:#C9D2E6;border-radius:10px;box-shadow:var(--sh);padding:10px 10px 10px 12px}
.term-row.l1{border-left-color:#F5C400}
.term-row.l2{border-left-color:var(--ok)}
.term-row .t,.term-row .d{display:flex;align-items:flex-start;gap:2px;min-width:0;word-break:break-word}
.term-row .t>span,.term-row .d>span{padding-top:4px;min-width:0}
.term-row .t{font-weight:800}
.term-row .d{color:var(--ink2);font-weight:600}
.term-row .b{display:flex;gap:4px}
.term-row .b button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#F2C94C}
.term-row .b button .ic{width:20px;height:20px;stroke:var(--ink);stroke-width:1.8}
.term-row .b button:hover{background:#F1F4FA}
@media(max-width:560px){.term-row{grid-template-columns:1fr auto}.term-row .d{grid-column:1/2}.term-row .b{grid-row:1/3;grid-column:2}}

/* math */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.ovl{border-top:2px solid currentColor;padding:0 2px}
sup,sub{font-size:.7em;line-height:0}

/* editor */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:800;font-size:.95rem}
.inp{width:100%;padding:11px 13px;border-radius:10px;border:2px solid var(--line);background:#fff;outline:none;resize:vertical;font-weight:600}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px #CDE6FF}
textarea.inp{min-height:46px;line-height:1.35}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.subj-pick,.emoji-pick{display:flex;gap:8px;flex-wrap:wrap}
.subj-pick button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-weight:800;background:#fff;border:var(--b)}
.subj-pick button .ic{width:16px;height:16px;margin:0}
.subj-pick button.on{background:var(--sc);box-shadow:2px 2px 0 #C9D0E6}
.emoji-pick button{width:44px;height:44px;border-radius:10px;background:#fff;border:2px solid var(--line);display:grid;place-items:center}
.emoji-pick button .ic{width:22px;height:22px;margin:0}
.emoji-pick button.on{border-color:var(--ink);background:var(--yellow);box-shadow:2px 2px 0 #C9D0E6}
.ed-row{background:var(--paper);border:var(--b);border-radius:12px;box-shadow:var(--sh);padding:12px;margin-bottom:14px}
.ed-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ed-num{font-family:var(--title);font-weight:800;background:var(--violet);color:var(--ink);border-radius:8px;padding:1px 9px;font-size:.92rem}
.ed-head button{width:36px;height:36px;border-radius:9px;background:#F1F4FA;display:grid;place-items:center}
.ed-head button .ic{width:18px;height:18px;margin:0}
.ed-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.ed-cols{grid-template-columns:1fr}}
.ed-lab{display:flex;align-items:center;justify-content:space-between;min-height:32px;margin-bottom:2px}
.ed-lab small{font-weight:800;color:var(--ink2);font-size:.8rem}
.ed-lab .msay{margin:0}
.ed-img{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.preview-line{font-size:.88rem;color:var(--ink2);margin-top:4px;min-height:1em}
.sticky-save{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--b);padding:8px 14px calc(10px + env(safe-area-inset-bottom));z-index:30}
.sticky-save .in{max-width:1000px;margin:0 auto;display:flex;gap:8px;align-items:center}
.palette{max-width:1000px;margin:0 auto 8px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.palette button{flex:none;min-width:38px;height:38px;border-radius:9px;background:#F1F4FA;border:1.5px solid var(--line);font-weight:700;padding:0 8px;font-size:1rem}
.palette button:active{background:var(--ink);color:#fff}
.pal-tabs{display:flex;gap:6px;max-width:1000px;margin:0 auto 6px}
.pal-tabs button{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ink)}
.pal-tabs button.on{background:#5B67A0;color:#fff;border-color:#5B67A0}

/* suggestions / voice */
.msay{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#EEF3FB;border:1.5px solid var(--line);flex:none;cursor:pointer;margin-right:6px;vertical-align:middle;color:var(--ink)}
.msay .ic{width:16px;height:16px}
.msay:active{background:var(--blue)}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg:empty{display:none}
.sg-head{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--ink2)}
.sg-head .ic{width:16px;height:16px;margin:0}
.sg-head .lang-link{margin-left:auto}
.sg{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:.98rem;transition:border-color .1s,background .1s}
.sg:hover,.sg:focus-visible{border-color:var(--ink);background:var(--warn-bg)}
.sg:active{background:var(--yellow)}
.sg-lab{font-weight:800;font-size:.8rem;color:var(--ink2);display:inline-flex;align-items:center}
.sg-wait{font-size:.82rem;color:var(--ink2);font-weight:700}
.lang-hint{animation:rise .25s}

/* images */
.cimg{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.cimg img{display:block;border-radius:8px;object-fit:contain;background:#fff;max-width:100%;border:1.5px solid var(--line)}
.cimg figcaption{font-size:.62rem;color:var(--ink2);font-weight:700;line-height:1.2;text-align:center;max-width:260px}
.cimg.sm{align-items:flex-start;margin-top:6px}
.cimg.sm img{max-height:70px;max-width:110px}
.cimg.sm figcaption{text-align:left;max-width:160px}
.cimg.fc{margin:20px 0 10px;max-width:85%}
.cimg.fc img{max-height:min(24vh,190px)}
.qbox .cimg,.tq .cimg{align-items:flex-start;margin-top:10px}
.qbox .cimg img{max-height:190px}
.tq .cimg img{max-height:140px}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;max-height:46vh;overflow:auto;padding:2px}
@media(min-width:640px){.img-grid{grid-template-columns:repeat(4,1fr)}}
.img-grid button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#F1F4FA;border:2px solid var(--line)}
.img-grid button:hover,.img-grid button:focus-visible{border-color:var(--ink)}
.img-grid img{width:100%;height:100%;object-fit:cover;display:block}
.img-grid button.pic{background:#fff}
.img-grid button.pic img{object-fit:contain;padding:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(58,69,112,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--paper);border-top:var(--b);border-radius:18px 18px 0 0;width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:rise .2s ease-out}
@media(min-width:640px){.modal{border:var(--b);border-radius:16px;box-shadow:6px 6px 0 #C9D0E6}}
.modal h2{font-size:1.35rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal h2 .ic{width:24px;height:24px}
.modal h2 .x{margin-left:auto;width:38px;height:38px;border-radius:10px;border:var(--b);display:grid;place-items:center;flex:none}
.modal h2 .x .ic{width:20px;height:20px}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;border:var(--b);font-size:.9rem}
.tabs button .ic{width:16px;height:16px}
.tabs button.on{background:#5B67A0;color:#fff;border-color:#5B67A0}
.codebox{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;padding:10px;border-radius:10px;border:2px solid var(--line);background:#F8FAFE;min-height:90px;resize:vertical;word-break:break-all}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;border:2px dashed var(--line)}
.qr canvas{width:240px;height:240px;image-rendering:pixelated}
.note{background:var(--warn-bg);border:var(--b);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0;font-weight:600}
.note.blue{background:var(--info-bg)}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;justify-items:center}
.avatars .avatar{width:48px;height:48px}
.avatars .avatar .ic{width:26px;height:26px}
.avatars button{border-radius:50%}
.avatars button.on .avatar{outline:3px solid var(--ink);outline-offset:3px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{text-align:center;padding:12px 8px;border-radius:12px;border:var(--b);background:#fff}
.badge .e{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;background:var(--yellow);border:var(--b);display:grid;place-items:center}
.badge .e .ic{width:28px;height:28px}
.badge b{display:block;font-family:var(--title)}
.badge small{color:var(--ink2);font-weight:700}
.badge.lock{opacity:.45}
.badge.lock .e{background:#E6EAF3}
.set-line{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);margin-bottom:8px}
.set-line .e{width:36px;height:36px;border-radius:9px;background:#F1F4FA;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.set-line .e .ic{width:20px;height:20px}
.set-line .tx{flex:1;min-width:0}
.set-line b{display:block}

/* toast */
.toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{display:flex;align-items:center;gap:8px;background:#4E5A8C;color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:3px 3px 0 rgba(58,69,112,.2);animation:rise .22s}
.toast .ic{color:var(--yellow);width:20px;height:20px}

/* play */
.play{max-width:820px;margin:0 auto;padding:12px 16px 40px}
.play-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.play-title{font-family:var(--title);font-weight:700;font-size:1.12rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.play-title .ic{width:22px;height:22px;margin:0}
.play-title .muted{font-weight:600}
.play-prog{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-family:var(--title);background:var(--paper);border:var(--b);border-radius:999px;padding:4px 12px;white-space:nowrap}
.play-prog .ic{width:16px;height:16px}
.pbar{height:12px;border:var(--b);border-radius:999px;background:#fff;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--green);transition:width .4s}

/* flashcard */
.fc-stage{perspective:1400px;margin:6px 0 18px}
.fc{position:relative;width:100%;height:min(56vh,400px);cursor:pointer;transition:transform .35s,opacity .35s}
.fc-inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--b);border-radius:6px;box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px 30px 56px;text-align:center;overflow:auto;
  background-color:var(--paper);background-image:linear-gradient(90deg,transparent 41px,var(--margin) 41px,var(--margin) 43px,transparent 43px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 20px}
.fc-back{transform:rotateY(180deg);background-color:var(--cream);background-image:none;padding-left:22px}
.fc-face .txt{font-family:var(--title);font-size:clamp(1.4rem,5vw,2.3rem);font-weight:700;word-break:break-word;line-height:1.15}
.fc-face .side{position:absolute;top:12px;left:56px;font-size:.8rem;font-weight:800;color:var(--ink3)}
.fc-back .side{left:18px}
.fc-face .say{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:10px;border:var(--b);background:#fff;display:grid;place-items:center}
.fc-face .say .ic{width:20px;height:20px}
.fc-face .hint{position:absolute;bottom:12px;font-size:.8rem;color:var(--ink3);font-weight:700}
.fc.out-r{transform:translateX(120%) rotate(12deg);opacity:0}
.fc.out-l{transform:translateX(-120%) rotate(-12deg);opacity:0}
.fc.in{animation:deal .28s ease-out}
@keyframes deal{from{transform:translateY(16px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.fc-ctrl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fc-count{font-family:var(--title);font-weight:700;font-size:1.1rem;text-align:center;min-width:64px}
.fc-tools{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.score-pills{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:800}
.score-pills span{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:999px;border:var(--b)}
.score-pills .ic{width:16px;height:16px;margin:0}
.score-pills .k{background:var(--ok-bg)}
.score-pills .l{background:var(--bad-bg)}

/* questions */
.qbox{position:relative;border:var(--b);border-radius:6px;box-shadow:var(--sh2);padding:18px 60px 20px 56px;margin-bottom:18px;
  background-color:var(--paper);background-image:linear-gradient(90deg,transparent 41px,var(--margin) 41px,var(--margin) 43px,transparent 43px),repeating-linear-gradient(180deg,transparent 0 29px,var(--rule) 29px 30px);background-position:0 0,0 12px}
.qbox .lab{font-size:.84rem;font-weight:800;color:var(--ink3)}
.qbox .q{font-family:var(--title);font-size:clamp(1.35rem,4.6vw,1.95rem);font-weight:700;margin-top:6px;word-break:break-word;line-height:1.15}
.qbox .say{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:10px;border:var(--b);background:#fff;display:grid;place-items:center}
.qbox .say .ic{width:20px;height:20px}
.qbox[style*="center"]{padding-left:22px;background-image:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border:var(--b);border-radius:12px;box-shadow:var(--sh);padding:12px 14px;font-weight:700;min-height:58px;word-break:break-word;transition:transform .08s,box-shadow .08s}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #C9D0E6}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:var(--b);background:#F1F4FA;display:grid;place-items:center;font-size:.9rem;font-family:var(--title);font-weight:800}
.opt.sel{background:var(--info-bg)}
.opt.sel .k{background:var(--blue)}
.opt.ok{background:var(--ok-bg)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:var(--bad-bg);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.dim{opacity:.45}
.vf{display:flex;gap:10px}
.vf .opt{flex:1;justify-content:center}
.answer-in{width:100%;padding:14px 16px;border-radius:12px;border:var(--b);font-size:1.2rem;font-weight:700;outline:none;background:#fff;box-shadow:inset 0 3px 0 #EEF2FA}
.answer-in:focus{box-shadow:0 0 0 3px #CDE6FF}
.answer-in.ok{background:var(--ok-bg)}
.answer-in.bad{background:var(--bad-bg);animation:shake .35s}
.fb{border:var(--b);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:700;animation:rise .2s}
.fb .ic{width:18px;height:18px}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb.typo{background:var(--warn-bg)}
.fb .ans{display:flex;align-items:center;gap:4px;font-family:var(--title);font-size:1.25rem;margin-top:4px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.kbd-hint{font-size:.8rem;color:var(--ink3);text-align:center;margin-top:12px;font-weight:700}

/* results */
.results{text-align:center;padding:26px 18px}
.res-e{width:88px;height:88px;margin:0 auto;border-radius:50%;background:var(--yellow);border:var(--b);box-shadow:var(--sh);display:grid;place-items:center}
.res-e .ic{width:46px;height:46px;stroke-width:1.9}
.results h2{font-size:1.7rem;margin:14px 0 4px}
.results .score{font-family:var(--title);font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.results p{font-weight:700}
.res-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.res-stats div{background:#F6F8FC;border:var(--b);border-radius:10px;padding:8px 16px;font-weight:700;font-size:.88rem}
.res-stats b{display:block;font-family:var(--title);font-size:1.4rem}
.res-list{text-align:left;margin:10px 0 16px}
.res-list h3{font-size:1.1rem}
.res-list .term-row{grid-template-columns:1fr 1fr}

/* test */
.tq{background:var(--paper);border:var(--b);border-radius:12px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:16px}
.tq .n{font-weight:800;color:var(--ink3);font-size:.86rem}
.tq .q{font-family:var(--title);font-size:1.25rem;font-weight:700;margin:4px 0 12px;word-break:break-word}
.tq.ok{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.tq.bad{border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.tq .corr{margin-top:10px;font-weight:800}
.tf-pair{background:#F6F8FC;border:1.5px dashed var(--rule2);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-weight:700}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:var(--b);border-radius:10px;box-shadow:var(--sh);padding:8px 6px;min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-family:var(--title);transition:transform .15s,opacity .3s,background .15s;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;font-size:.95rem;min-width:0}
.tile.def{background:var(--cream);font-family:var(--font)}
.tile.sel{background:var(--blue);transform:translate(-2px,-2px);box-shadow:5px 5px 0 #C9D0E6}
.tile.bad{background:var(--bad-bg);animation:shake .35s}
.tile.gone{opacity:0;transform:scale(.7);pointer-events:none}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:1000px}
.mcard{position:relative;aspect-ratio:3/4;cursor:pointer}
@media(min-width:700px){.mcard{aspect-ratio:4/3}}
.mcard .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:8px;border:var(--b);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-weight:700;font-size:.85rem;word-break:break-word;overflow:hidden}
.mcard .f{background-color:#AEB8EA;box-shadow:var(--sh);background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:12px 12px}
.mcard .f .logo-mark{width:58%;height:auto;max-height:70%}
.mcard .b{background:#fff;transform:rotateY(180deg)}
.mcard .b.d{background:var(--cream)}
.mcard.done .b{background:var(--ok-bg)}

/* meteor */
.sky{position:relative;height:56vh;min-height:300px;border:var(--b);border-radius:14px;overflow:hidden;box-shadow:var(--sh2);
  background-color:#6B78B5;background-image:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.4px),linear-gradient(180deg,#5A67A6,#9AA6DA);background-size:70px 70px,43px 43px,100% 100%;background-position:0 0,20px 25px,0 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--green);border-top:var(--b);background-image:repeating-linear-gradient(90deg,transparent 0 14px,rgba(58,69,112,.18) 14px 16px)}
.meteor{position:absolute;left:0;top:0;max-width:72%;background:var(--orange);color:var(--ink);font-weight:700;padding:8px 14px;border:var(--b);border-radius:999px;box-shadow:0 0 0 5px rgba(255,221,184,.45),3px 3px 0 rgba(58,69,112,.35);text-align:center;font-family:var(--title);font-size:1.05rem;word-break:break-word;will-change:transform}
.meteor:before{content:"";position:absolute;left:50%;top:-30px;width:8px;margin-left:-4px;height:30px;border-radius:4px;background:linear-gradient(180deg,transparent,rgba(255,221,184,.95))}
.meteor.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.8);opacity:0}}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-family:var(--title);z-index:2}
.hud .ic{width:20px;height:20px;color:var(--pink);margin-right:2px}
.sky-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;z-index:3;background:rgba(74,86,140,.88)}
.sky-msg>.ic,.sky-msg .res-e{margin-bottom:6px}
.sky-msg .ans{font-family:var(--title);font-size:1.6rem;background:#fff;color:var(--ink);padding:6px 16px;border-radius:10px;border:var(--b);margin:10px 0}
.lvlup{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--title);font-size:2rem;color:var(--yellow);font-weight:800;z-index:3;animation:lvl 1.2s forwards}
@keyframes lvl{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}

/* flash */
.flash-card{border:var(--b);border-radius:6px;box-shadow:var(--sh2);padding:24px 16px;text-align:center;margin:14px 0 16px;background:var(--paper);transition:background .2s}
.flash-card .a{font-family:var(--title);font-size:clamp(1.35rem,4.6vw,1.95rem);font-weight:700;word-break:break-word}
.flash-card .eq{font-size:1.5rem;margin:6px 0;color:var(--ink3);font-weight:800}
.flash-card .a+.eq+.a{background:linear-gradient(transparent 55%,var(--yellow) 55%);display:inline;padding:0 4px}
.flash-card.good{background:var(--ok-bg)}
.flash-card.bad{background:var(--bad-bg);animation:shake .3s}
.combo{font-family:var(--title);font-weight:800;color:var(--margin);font-size:1.15rem;text-align:center;min-height:1.6em}
.combo .ic{width:20px;height:20px}
.tbar{height:14px;border:var(--b);border-radius:999px;background:#fff;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--yellow);transition:width .2s linear}

/* spell */
.ear{width:112px;height:112px;border-radius:50%;background:var(--blue);border:var(--b);box-shadow:4px 4px 0 #C9D0E6;display:grid;place-items:center;margin:10px auto 14px}
.ear .ic{width:50px;height:50px;stroke-width:1.9}
.ear:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #C9D0E6}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

/* embed */
body.embed{background:#fff;background-image:none}
body.embed .wrap{padding:8px 10px 20px}
body.embed .foot{display:none}
.embed-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:var(--b);background:#fff;position:sticky;top:0;z-index:20}
.embed-bar .si{width:34px;height:34px;border-radius:8px;background:var(--yellow)}
.embed-bar .si .ic{width:18px;height:18px}
.embed-bar .t{font-family:var(--title);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.embed-modes{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;background:#F6F8FC;border-bottom:2px solid var(--line)}
.embed-modes::-webkit-scrollbar{display:none}
.embed-modes button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:800;background:#fff;border:var(--b);font-size:.86rem}
.embed-modes button .ic{width:16px;height:16px;margin:0}
.embed-modes button.on{background:#5B67A0;color:#fff;border-color:#5B67A0}
body.embed .play{padding-top:10px}
body.embed .fc{height:min(40vh,300px)}
body.embed .sky{height:46vh}

.foot{text-align:center;color:var(--ink2);font-weight:700;font-size:.86rem;margin-top:44px}
.foot b{font-family:var(--title);color:var(--ink)}
.shared-banner{background:var(--yellow);border:var(--b);border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.shared-banner>span .ic{width:28px;height:28px}
.shared-banner .tx{flex:1;min-width:180px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v4 : éditeur façon Quizlet (image et langue par côté) */
.ed-cols{gap:16px}
.ed-field{display:grid;grid-template-columns:1fr 78px;gap:10px;align-items:start}
.ed-in{min-width:0}
.ed-in .ed-lab{margin:4px 0 0;justify-content:flex-start;gap:8px;min-height:30px}
.ed-in .ed-lab small{font-size:.8rem}
.lang-link{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:.8rem;color:#5B67A0;padding:2px 4px;border-radius:6px}
.lang-link .ic{width:14px;height:14px;margin:0}
.lang-link:hover{background:var(--info-bg)}
.ed-in .ed-lab .msay{margin-left:auto}

var PASTE = { sep: 'tab', line: 'nl', swap: false };
ACT.openPaste = function () {

    '<div class="field" style="margin-top:10px"><label>Entre le terme et la définition</label><div class="seg" id="sepSeg">' + sepBtn('tab', 'Tabulation') + sepBtn('comma', 'Virgule') + sepBtn('semi', 'Point-virgule') + sepBtn('dash', ' - ') + sepBtn('eq', ' = ') + sepBtn('colon', ' : ') + '</div></div>' +
    '<span class="toggle' + (PASTE.swap ? ' on' : '') + '" data-act="pasteSwap"><span class="sw"></span>Inverser terme / définition</span>' +
    '<div class="note blue" id="pastePrev">Aperçu : 0 carte</div>' +

function sepBtn(id, l) { return '<button class="' + (PASTE.sep === id ? 'on' : '') + '" data-act="pasteSep" data-s="' + id + '">' + l + '</button>'; }
function splitPaste(text) {
  var lines = text.replace(/\r/g, '').split('\n'), out = [];
  for (var i = 0; i < lines.length; i++) {
    var L = lines[i]; if (!L.replace(/\s/g, '')) continue;
    var idx = -1, len = 1;
    if (PASTE.sep === 'tab') { idx = L.indexOf('\t'); }
    else if (PASTE.sep === 'comma') { idx = L.indexOf(','); }
    else if (PASTE.sep === 'semi') { idx = L.indexOf(';'); }
    else if (PASTE.sep === 'dash') { idx = L.indexOf(' - '); len = 3; if (idx < 0) { idx = L.indexOf(' – '); } }
    else if (PASTE.sep === 'eq') { idx = L.indexOf('='); }
    else if (PASTE.sep === 'colon') { idx = L.indexOf(':'); }
    if (idx < 0) continue;
    var t = L.slice(0, idx).replace(/^\s+|\s+$/g, '').replace(/^"|"$/g, ''), d = L.slice(idx + len).replace(/^\s+|\s+$/g, '').replace(/^"|"$/g, '');
    if (!t || !d) continue;
    out.push(PASTE.swap ? { t: d, d: t } : { t: t, d: d });
  }
  return out;
}
function pastePreview() {
  var ta = byId('pasteIn'), pv = byId('pastePrev'); if (!ta || !pv) return;
  var a = splitPaste(ta.value), h = '<b>Aperçu : ' + plural(a.length, 'carte') + '</b>';
  for (var i = 0; i < Math.min(3, a.length); i++) h += '<br>• ' + esc(a[i].t) + ' → ' + esc(a[i].d);
  if (a.length > 3) h += '<br>…';
  pv.innerHTML = h;
}

    box.innerHTML = ''; box.appendChild(cv);

    if (useQcm && ds.length >= 1) {
      G.opts = shuffle(ds.concat([it.q.a])); G.okIdx = G.opts.indexOf(it.q.a);
      var h = qboxHTML(it.q.qLab + ' · choisis la bonne réponse', it.q.q, it.q.qImg, it.q.ql, set.math) + '<div class="opts">';
      for (var i = 0; i < G.opts.length; i++) h += '<button class="opt" data-act="g" data-fn="pick" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span style="flex:1">' + fmt(G.opts[i], set.math) + '</span></button>';

      G.qcm = false;
      body(qboxHTML(it.q.qLab + ' · écris ' + (it.q.d === 'def' ? 'la définition' : 'le terme'), it.q.q, it.q.qImg, it.q.ql, set.math) + writeArea());

/* ---------------- ÉCRIRE ---------------- */
MODE_IMPL.write = function (set, mode, list) {

  shell(mode, set); attachWritten(G);
  G.ask = function () {
    var c = G.list[G.i]; G.curCard = c; G.q = qa(set, c, getDir(set)); G.expected = G.q.a; G.aLang = G.q.al; G.locked = false;
    autoSay(G.q.q, G.q.ql, set.math);

  };
  G.onResult = function (ok) { record(set, G.curCard, ok); if (ok) G.good++; else G.wrong.push(G.curCard); setProg((G.i + 1) + ' / ' + G.list.length + ' · ' + ic('check') + G.good); };
  G.onOverride = function () { G.good++; G.wrong.pop(); record(set, G.curCard, true); };
  G.advance = function () { G.i++; if (G.i >= G.list.length) G.end(); else G.ask(); };
  G.retry = function () { MODE_IMPL.write(set, mode, shuffle(G.wrong)); };
  G.end = function () {
    var n = G.list.length, pc = Math.round(100 * G.good / n);

/* ---------------- TEST ---------------- */
MODE_IMPL.test = function (set, mode) {
  var pool = poolOf(set);

  G.config = function () {

    var opts = [5, 10, 20], h = '<div class="card"><h2 style="margin-bottom:12px">' + ic('clipboard-check') + 'Prépare ton test</h2><div class="field"><label>Nombre de questions</label><div class="seg">';

    h += '<span class="toggle' + (G.types.wr ? ' on' : '') + '" data-act="g" data-fn="setT" data-t="wr"><span class="sw"></span>' + ic('pencil-line') + 'Réponse écrite</span></div></div>';
    h += '<button class="btn green big wide" data-act="g" data-fn="build">' + ic('rocket') + 'Lancer le test</button></div>';
    body(h);
  };

  G.setT = function (el) { var t = el.getAttribute('data-t'); G.types[t] = !G.types[t]; if (!G.types.qcm && !G.types.tf && !G.types.wr) G.types[t] = true; G.config(); };
  G.build = function () {
    var types = []; if (G.types.qcm) types.push('qcm'); if (G.types.tf) types.push('tf'); if (G.types.wr) types.push('wr');
    var cards = shuffle(pool).slice(0, G.n), dir = getDir(set);

      if (t === 'tf') { var d1 = distractors(set, c, q.d, 1); o.truth = !d1.length || Math.random() < 0.5; o.shown = o.truth ? q.a : d1[0]; }
      G.Q.push(o);
    }

    G.graded = false; G.drawTest();

      h += '<div class="tq" id="tq' + i + '"><div class="n">Question ' + (i + 1) + ' / ' + G.Q.length + ' · ' + labels[o.t] + '</div><div class="q">' + miniSay(o.q.q, o.q.ql, set.math) + fmt(o.q.q, set.math) + imgHTML(o.q.qImg, 'q') + '</div>';
      if (o.t === 'qcm') { h += '<div class="opts">'; for (var k = 0; k < o.opts.length; k++) h += '<button class="opt" data-act="g" data-fn="tPick" data-q="' + i + '" data-o="' + k + '"><span class="k">' + 'ABCD'.charAt(k) + '</span><span>' + fmt(o.opts[k], set.math) + '</span></button>'; h += '</div>'; }
      else if (o.t === 'tf') { h += '<div class="tf-pair">→ ' + fmt(o.shown, set.math) + '</div><div class="vf"><button class="opt" data-act="g" data-fn="tPick" data-q="' + i + '" data-o="1">' + ic('check') + 'Vrai</button><button class="opt" data-act="g" data-fn="tPick" data-q="' + i + '" data-o="0">' + ic('x') + 'Faux</button></div>'; }
      else { h += '<input class="answer-in" id="tin' + i + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (o.q.d === 'def' ? 'La définition…' : 'Le terme…') + '">'; }

    }

    body(h); setProg('0 / ' + G.Q.length); setBar(0);
  };
  G.answered = function () { var n = 0; for (var i = 0; i < G.Q.length; i++) { var o = G.Q[i]; if (o.t === 'wr' ? (byId('tin' + i) && byId('tin' + i).value.replace(/\s/g, '')) : o.ans != null) n++; } return n; };

/* ---------------- ASSOCIER ---------------- */
MODE_IMPL.match = function (set, mode) {
  var cards = shuffle(poolOf(set)).slice(0, 6), tiles = [];
  for (var i = 0; i < cards.length; i++) { tiles.push({ id: cards[i].id, s: 't', x: cards[i].t, c: cards[i] }); tiles.push({ id: cards[i].id, s: 'd', x: cards[i].d, c: cards[i] }); }
  tiles = shuffle(tiles);
  var G = GAME = { set: set, mode: mode, tiles: tiles, sel: null, left: cards.length, pen: 0, n: cards.length };
  shell(mode, set);
  G.intro = function () {
    setProg('');
    var b = DB.best[set.id] && DB.best[set.id].match;
    body('<div class="card results"><div class="res-art">' + art('m_match') + '</div><h2>Associe les paires !</h2><p class="muted" style="font-weight:700">Touche un terme puis sa définition le plus vite possible.<br>Une erreur = +1 seconde.</p>' + (b ? '<p style="font-weight:900">' + ic('trophy') + 'Ton record : ' + fmtTime(b) + '</p>' : '') + '<button class="btn pink big" data-act="g" data-fn="start">C\'est parti !</button></div>');
  };
  G.start = function () {
    var h = '<div class="mgrid">';
    for (var i = 0; i < G.tiles.length; i++) h += '<button class="tile' + (G.tiles[i].s === 'd' ? ' def' : '') + '" id="mt' + i + '" data-act="g" data-fn="pick" data-i="' + i + '">' + fmt(G.tiles[i].x, set.math) + '</button>';
    body(h + '</div>');
    G.t0 = Date.now();
    G.iv = setInterval(function () { setProg(ic('timer') + ((Date.now() - G.t0 + G.pen) / 1000).toFixed(1) + ' s'); }, 100);
  };
  G.pick = function (el) {
    var i = +el.getAttribute('data-i'), t = G.tiles[i];
    if (t.gone) return;

    var a = G.tiles[G.sel], ea = byId('mt' + G.sel);

    if (a.id === t.id && a.s !== t.s) {

    if (G.n >= 6 && t < 20000) badge('speed');

    results({ art: rec ? 'b_trophy' : 'm_match', title: rec ? 'Nouveau record !' : 'Bien joué !', score: fmtTime(t), sub: G.pen ? '(dont ' + (G.pen / 1000) + ' s de pénalité)' : 'Aucune erreur !', stats: [['Record', fmtTime(B.match || t)], ['Paires', G.n]], actions: playAgain(ic('repeat') + 'Rejouer', 'match'), party: rec });
  };
  G.destroy = function () { clearInterval(G.iv); };
  G.intro();
};

/* ---------------- MÉMOIRE ---------------- */

  var cards = shuffle(poolOf(set)).slice(0, 8), tiles = [];
  for (var i = 0; i < cards.length; i++) { tiles.push({ id: cards[i].id, s: 't', x: cards[i].t, c: cards[i] }); tiles.push({ id: cards[i].id, s: 'd', x: cards[i].d, c: cards[i] }); }

    }

  };

  G.hud = function () { byId('hLives').innerHTML = new Array(G.lives + 1).join(ic('heart', 'fill')) + new Array(4 - G.lives).join(ic('heart')); byId('hLvl').textContent = 'Niv. ' + G.lvl; byId('hScore').textContent = G.score + ' pts'; setProg(ic('flame') + G.score); };
  G.hud();
  G.go = function () { byId('skyMsg').classList.add('hidden'); G.paused = false; G.last = 0; G.spawnIn = 0; sfx('whoosh'); byId('ans').focus(); G.raf = requestAnimationFrame(G.loop); };
  G.pick = function () {
    if (!G.deck.length) G.deck = shuffle(poolOf(set));
    var act = {}; for (var i = 0; i < G.mets.length; i++) act[G.mets[i].c.id] = 1;
    for (var k = 0; k < G.deck.length; k++) { if (!act[G.deck[k].id]) return G.deck.splice(k, 1)[0]; }
    return G.deck.shift();
  };
  G.spawn = function () {
    var c = G.pick(), q = qa(set, c, getDir(set)), el = document.createElement('div');
    el.className = 'meteor'; el.innerHTML = art('p_meteor', 'rock') + '<span class="w">' + fmt(q.q, set.math) + '</span>'; sky.appendChild(el);
    var W = sky.clientWidth, w = el.offsetWidth, x = 8 + Math.random() * Math.max(0, W - w - 16);
    var m = { c: c, q: q, el: el, x: x, y: -el.offsetHeight - 10 };
    el.style.transform = 'translate(' + x + 'px,' + m.y + 'px)';
    G.mets.push(m);
  };
  G.loop = function (ts) {
    if (G.over) return;
    if (!G.last) G.last = ts;
    var dt = Math.min(0.08, (ts - G.last) / 1000); G.last = ts;
    if (!G.paused && !document.hidden) {
      var H = sky.clientHeight * 0.8, speed = H / (14 / (1 + 0.16 * (G.lvl - 1)));
      for (var i = G.mets.length - 1; i >= 0; i--) {
        var m = G.mets[i]; m.y += speed * dt; m.el.style.transform = 'translate(' + m.x + 'px,' + m.y + 'px)';
        if (m.y + m.el.offsetHeight >= H) { G.miss(m); break; }
      }
      G.spawnIn -= dt;
      var maxC = Math.min(3, 1 + Math.floor((G.lvl - 1) / 2));
      if (!G.paused && (G.mets.length === 0 || (G.spawnIn <= 0 && G.mets.length < maxC))) { G.spawn(); G.spawnIn = Math.max(2.4, 7 - G.lvl * 0.6); }
    }
    G.raf = requestAnimationFrame(G.loop);
  };
  G.remove = function (m, boom) {
    var i = G.mets.indexOf(m); if (i >= 0) G.mets.splice(i, 1);
    if (boom) { var bx = document.createElement('div'); bx.className = 'pboom'; bx.innerHTML = art('p_boom'); bx.style.transform = 'translate(' + (m.x + m.el.offsetWidth / 2 - 60) + 'px,' + (m.y + m.el.offsetHeight / 2 - 60) + 'px)'; sky.appendChild(bx); setTimeout(function () { if (bx.parentNode) bx.parentNode.removeChild(bx); }, 600);
      m.el.classList.add('boom'); setTimeout(function () { if (m.el.parentNode) m.el.parentNode.removeChild(m.el); }, 360); }
    else if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
  };
  G.send = function () {
    var inp = byId('ans'), v = inp.value; if (!v.replace(/\s/g, '')) return;
    if (G.fix) {
      if (checkAnswer(v, G.fix.q.a, set.math).ok) { G.fix = null; inp.value = ''; byId('skyMsg').classList.add('hidden'); G.paused = false; sfx('tap'); }
      else { shakeEl(inp, 'bad'); sfx('bad'); }
      return;
    }
    if (G.paused) return;
    for (var i = 0; i < G.mets.length; i++) {
      var m = G.mets[i];
      if (checkAnswer(v, m.q.a, set.math).ok) {
        G.remove(m, true); G.score += 10 * G.lvl; G.hits++; record(set, m.c, true, 5); sfx('boom', G.lvl); inp.value = ''; inp.classList.remove('bad');
        if (G.hits % 5 === 0) { G.lvl++; sfx('win'); var l = document.createElement('div'); l.className = 'lvlup'; l.innerHTML = ic('arrow-up') + 'Niveau ' + G.lvl; sky.appendChild(l); setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 1300); }
        G.hud(); return;
      }
    }
    shakeEl(inp, 'bad'); sfx('bad'); setTimeout(function () { inp.classList.remove('bad'); }, 400);
  };
  G.miss = function (m) {
    G.remove(m, false); G.lives--; record(set, m.c, false); sfx('lose'); G.hud();
    if (G.lives <= 0) { G.end(); return; }
    G.paused = true; G.fix = m;
    var msg = byId('skyMsg');
    msg.innerHTML = '<div style="font-size:2.4rem">' + ic('circle-alert') + '</div><h2>Raté !</h2><div style="margin-top:6px">' + fmt(m.q.q, set.math) + '</div><div class="ans">' + fmt(m.q.a, set.math) + '</div><p style="font-weight:700">Recopie la réponse pour continuer</p>';
    msg.classList.remove('hidden'); var inp = byId('ans'); inp.value = ''; inp.focus();
  };
  G.end = function () {
    G.over = true; cancelAnimationFrame(G.raf);
    var B = DB.best[set.id] || (DB.best[set.id] = {}), rec = !B.meteor || G.score > B.meteor;
    if (rec && G.score > 0) B.meteor = G.score;
    if (G.score >= 300) badge('meteor');
    results({ art: rec && G.score ? 'b_trophy' : 'e_meteor', title: rec && G.score ? 'Nouveau record !' : 'Fin de partie', score: G.score + ' pts', sub: 'Niveau ' + G.lvl + ' atteint · ' + G.hits + ' météores détruits', stats: [['Record', (B.meteor || 0) + ' pts']], actions: playAgain(ic('repeat') + 'Rejouer', 'meteor'), party: rec && G.score > 0 });
  };
  G.onKey = function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'ans') { e.preventDefault(); G.send(); } };
  G.destroy = function () { G.over = true; cancelAnimationFrame(G.raf); };
};

/* ---------------- ÉCLAIR (vrai / faux) ---------------- */
MODE_IMPL.flash = function (set, mode) {
  var G = GAME = { set: set, mode: mode, score: 0, combo: 0, maxCombo: 0, good: 0, bad: 0, dur: 60000, busy: false };
  shell(mode, set);
  var b = DB.best[set.id] && DB.best[set.id].flash;
  body('<div class="card results"><div class="res-art emb">' + art('e_flash') + '</div><p class="muted" style="font-weight:700">60 secondes. Vrai ou faux : la réponse correspond-elle ?<br>Enchaîne les bonnes réponses pour un combo !</p>' + (b ? '<p style="font-weight:900">' + ic('trophy') + 'Record : ' + b + ' pts</p>' : '') + '<button class="btn yellow big" data-act="g" data-fn="go">' + ic('zap') + 'Go !</button><p class="kbd-hint">Clavier : ← faux · → vrai</p></div>');
  setProg('');
  G.go = function () {
    G.end = Date.now() + G.dur; G.pool = poolOf(set); G.lastId = null;
    body('<div class="tbar"><i id="tb" style="width:100%"></i></div><div class="flash-card" id="fcard"></div><div class="combo" id="combo"></div><div class="row" style="flex-wrap:nowrap"><button class="btn red big" style="flex:1" data-act="g" data-fn="ans" data-v="0">' + ic('x') + 'Faux</button><button class="btn green big" style="flex:1" data-act="g" data-fn="ans" data-v="1">' + ic('check') + 'Vrai</button></div>');
    G.iv = setInterval(function () { var r = G.end - Date.now(); var tb = byId('tb'); if (tb) tb.style.width = Math.max(0, 100 * r / G.dur) + '%'; if (r <= 0) G.finish(); else if (r < 5000 && Math.floor(r / 1000) !== G.lastTick) { G.lastTick = Math.floor(r / 1000); sfx('tick'); } }, 100);
    G.next();
  };
  G.next = function () {
    var c; do { c = G.pool[Math.floor(Math.random() * G.pool.length)]; } while (G.pool.length > 1 && c.id === G.lastId);
    G.lastId = c.id; G.c = c; G.q = qa(set, c, getDir(set));
    var d = distractors(set, c, G.q.d, 1); G.truth = !d.length || Math.random() < 0.5; G.shown = G.truth ? G.q.a : d[0];
    var fc = byId('fcard'); fc.className = 'flash-card'; fc.innerHTML = '<div class="a">' + fmt(G.q.q, set.math) + '</div><div class="eq">=</div><div class="a" style="color:var(--pri)">' + fmt(G.shown, set.math) + '</div>';
    setProg(ic('zap') + G.score); G.busy = false;
  };
  G.ans = function (el) {
    if (G.busy || !G.iv) return; G.busy = true;
    var v = typeof el === 'string' ? el : el.getAttribute('data-v'), ok = (v === '1') === G.truth, fc = byId('fcard');
    if (ok) { G.combo++; G.good++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.score += 1 + Math.floor(G.combo / 5); sfx('good', G.combo); fc.classList.add('good'); record(set, G.c, true, 3); byId('combo').innerHTML = G.combo >= 5 ? art('p_star') + 'Combo x' + (1 + Math.floor(G.combo / 5)) : ''; setTimeout(G.next, 260); }
    else { G.combo = 0; G.bad++; sfx('bad'); fc.classList.add('bad'); record(set, G.c, false); byId('combo').innerHTML = ic('check') + fmt(G.q.q, set.math) + ' = ' + fmt(G.q.a, set.math); setTimeout(function () { byId('combo').textContent = ''; G.next(); }, 1100); }
    setProg(ic('zap') + G.score);
  };
  G.finish = function () {
    clearInterval(G.iv); G.iv = null;
    var B = DB.best[set.id] || (DB.best[set.id] = {}), rec = !B.flash || G.score > B.flash;
    if (rec && G.score > 0) B.flash = G.score;
    if (G.score >= 20) badge('flash20');
    results({ art: rec && G.score ? 'b_trophy' : 'e_flash', title: rec && G.score ? 'Nouveau record !' : 'Temps écoulé !', score: G.score + ' pts', stats: [['Justes', G.good], ['Erreurs', G.bad], ['Meilleur combo', G.maxCombo]], actions: playAgain(ic('repeat') + 'Rejouer', 'flash'), party: rec && G.score > 0 });
  };
  G.onKey = function (e) { if (!G.iv) return; if (e.key === 'ArrowLeft' || e.key === 'f' || e.key === 'F') G.ans('0'); else if (e.key === 'ArrowRight' || e.key === 'v' || e.key === 'V') G.ans('1'); };
  G.destroy = function () { clearInterval(G.iv); };
};

/* ---------------- DICTÉE ---------------- */
MODE_IMPL.spell = function (set, mode, list) {
  var side = set.termLang ? 't' : 'd', lang = side === 't' ? set.termLang : set.defLang, other = side === 't' ? 'd' : 't';
  var G = GAME = { set: set, mode: mode, math: set.math, list: list || shuffle(poolOf(set)), i: 0, good: 0, wrong: [] };
  shell(mode, set); attachWritten(G);
  G.ask = function () {
    var c = G.list[G.i]; G.curCard = c; G.expected = c[side]; G.aLang = lang; G.locked = false;
    setProg((G.i + 1) + ' / ' + G.list.length + ' · ' + ic('check') + G.good); setBar(100 * G.i / G.list.length);
    body('<div class="qbox" style="text-align:center"><div class="lab">Écoute et écris ' + (side === 't' ? 'le terme' : 'la définition') + ' · ' + esc(langName(lang)) + '</div><button class="ear art-ear" data-act="g" data-fn="play" aria-label="Écouter">' + art('m_spell') + '</button><div class="row center"><button class="btn sm" data-act="g" data-fn="slow">' + ic('turtle') + 'Plus lentement</button><button class="btn sm" data-act="g" data-fn="hint" id="hintBtn">' + ic('lightbulb') + 'Indice</button></div><div id="hint" class="muted" style="margin-top:10px;font-weight:800"></div></div>' + writeArea());
    focusAns(); setTimeout(G.play, 250);
  };
  G.play = function () { speak(plain(G.curCard[side], set.math), lang, 0.9); };
  G.slow = function () { speak(plain(G.curCard[side], set.math), lang, 0.55); };
  G.hint = function () { byId('hint').innerHTML = fmt(G.curCard[other], set.math); var hb = byId('hintBtn'); if (hb) hb.disabled = true; };
  G.onResult = function (ok) { record(set, G.curCard, ok); if (ok) G.good++; else G.wrong.push(G.curCard); };
  G.onOverride = function () { G.good++; G.wrong.pop(); record(set, G.curCard, true); };
  G.advance = function () { G.i++; if (G.i >= G.list.length) G.end(); else G.ask(); };
  G.retry = function () { MODE_IMPL.spell(set, mode, shuffle(G.wrong)); };
  G.end = function () {
    var n = G.list.length, pc = Math.round(100 * G.good / n);
    results({ pc: pc, title: pc === 100 ? 'Oreille d\'or !' : 'Dictée terminée', score: G.good + ' / ' + n, sub: pc + ' % de réussite', actions: (G.wrong.length ? '<button class="btn pink" data-act="g" data-fn="retry">' + ic('repeat') + 'Refaire mes ' + G.wrong.length + ' erreurs</button>' : '') + playAgain(ic('shuffle') + 'Recommencer', 'spell'), list: cardRows(set, G.wrong), party: pc >= 80 });
  };
  G.ask();
};

/* ================= BOOT ================= */
var DEMOS = [];
try { DEMOS = JSON.parse(byId('demo-data').textContent); } catch (e) { DEMOS = []; }

document.addEventListener('mousedown', function (e) { var t = e.target; while (t && t !== document) { if (t.getAttribute && (t.getAttribute('data-act') === 'ins' || t.getAttribute('data-act') === 'palTab')) { e.preventDefault(); return; } t = t.parentNode; } });

function boot() {
  var hs = location.hash || '', m;
  if ((m = hs.match(/^#e=([A-Za-z0-9_\-]+)(?:!([a-z]+))?/))) {
    document.body.classList.add('embed');
    var code = m[1], dm = m[2] || 'cards';
    $app.innerHTML = '<div class="empty"><div class="res-e">' + ic('loader') + '</div></div>';
    decodeSet(code, function (s, err) {
      if (!s) { $app.innerHTML = '<div class="card empty" style="margin:20px"><div class="res-e">' + ic('frown') + '</div><p>' + esc(err || 'Liste introuvable') + '</p></div>'; return; }
      TEMP[s.id] = s;
      EMBED = { setId: s.id, mode: dm, link: baseURL() + '#s=' + code };
      VIEW = { name: 'set', setId: s.id };
      if (modeById(dm) && modeAvailable(modeById(dm), s)) startMode(dm); else render();
    });
    return;
  }
  if ((m = hs.match(/^#s=([A-Za-z0-9_\-]+)/))) {
    $app.innerHTML = '<div class="empty"><div class="res-e">' + ic('loader') + '</div></div>';
    decodeSet(m[1], function (s, err) {
      if (!s) { go('home'); toast('' + (err || 'Lien illisible')); clearHash(); return; }
      openReceived(s);
    });
    return;
  }
  render();
}
window.addEventListener('hashchange', function () { if (/^#[se]=/.test(location.hash)) { closeAllModals(); EMBED = null; document.body.classList.remove('embed'); boot(); } });
boot();

})();
</script>
